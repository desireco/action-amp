<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ActionAmp — Easiest way to get into action</title>
    <style>
      :root {
        /* OKLCH-tinted neutrals, never pure gray. Cool tint, very low chroma. */
        --font:
          ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Text",
          "SF Pro Display", Roboto, sans-serif;
        --font-mono: ui-monospace, SFMono-Regular, Menlo, monospace;

        /* Teal family — Committed strategy: this carries the surface */
        --teal: oklch(0.72 0.15 220);
        --teal-bright: oklch(0.78 0.14 215);
        --teal-cta: oklch(0.58 0.16 225);
        --teal-cta-hover: oklch(0.5 0.16 228);
        --teal-soft: oklch(0.95 0.04 220);
        --teal-soft-strong: oklch(0.9 0.07 220);
        --teal-tint-shadow: oklch(0.58 0.16 225 / 0.22);

        /* Amber — human emphasis, rare */
        --amber: oklch(0.78 0.16 70);
        --amber-text: oklch(0.45 0.13 65);
        --amber-soft: oklch(0.95 0.06 75);

        /* Cool-tinted neutral ramp (Things DNA) */
        --bg: oklch(0.99 0.005 230);
        --bg-soft: oklch(0.97 0.008 230);
        --bg-deep: oklch(0.94 0.01 230);
        --surface: oklch(1 0.003 230);
        --surface-muted: oklch(0.96 0.008 230);
        --surface-muted-2: oklch(0.93 0.01 230);
        --border: oklch(0.91 0.01 230);
        --border-strong: oklch(0.86 0.012 230);
        --text: oklch(0.2 0.015 230);
        --text-2: oklch(0.36 0.015 230);
        --text-3: oklch(0.5 0.015 230);
        --text-4: oklch(0.62 0.012 230);

        --shadow-sm: 0 1px 2px oklch(0.2 0.02 230 / 0.05);
        --shadow-md:
          0 2px 6px oklch(0.2 0.02 230 / 0.06),
          0 12px 32px oklch(0.2 0.02 230 / 0.06);
        --shadow-lg:
          0 4px 12px oklch(0.2 0.02 230 / 0.06),
          0 32px 80px oklch(0.2 0.02 230 / 0.1);
        --hero-shadow:
          0 2px 6px oklch(0.2 0.02 230 / 0.05),
          0 40px 96px var(--teal-tint-shadow);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        scroll-behavior: smooth;
      }
      body {
        font-family: var(--font);
        background: #0a0a0a;
        color: var(--text);
        line-height: 1.5;
      }
      button,
      input {
        font-family: inherit;
      }
      button {
        cursor: pointer;
        border: none;
        background: none;
        color: inherit;
        font-size: inherit;
      }
      svg {
        display: block;
      }
      a {
        color: var(--teal-cta);
        text-decoration: none;
        transition: color 0.15s;
      }
      a:hover {
        color: var(--teal-cta-hover);
        text-decoration: underline;
      }

      /* workbench (preview frame around the page) */
      .workbench {
        min-height: 100vh;
        padding: 32px 24px 64px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 32px;
      }
      .wb-head {
        color: #888;
        text-align: center;
      }
      .wb-head h1 {
        color: #ddd;
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 4px;
      }
      .wb-head p {
        font-size: 13px;
      }
      .wb-row {
        display: flex;
        gap: 32px;
        align-items: flex-start;
        flex-wrap: wrap;
        justify-content: center;
      }
      .device-label {
        color: #888;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        font-weight: 600;
        text-align: center;
        margin-bottom: 12px;
      }
      .frame {
        background: var(--bg);
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 32px 80px rgba(0, 0, 0, 0.5);
        position: relative;
      }
      .frame.desktop {
        width: 1100px;
        border-radius: 12px;
        border: 1px solid #2a2a2a;
      }
      .frame.mobile {
        width: 390px;
        border-radius: 48px;
        border: 11px solid #1a1a1a;
        box-shadow:
          0 32px 80px rgba(0, 0, 0, 0.5),
          inset 0 0 0 2px #2a2a2a;
      }
      .mobile-notch {
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 120px;
        height: 28px;
        background: #1a1a1a;
        border-radius: 0 0 18px 18px;
        z-index: 100;
      }
      .desktop-chrome {
        background: #1f1f1f;
        padding: 10px 14px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .desktop-chrome .cdot {
        width: 11px;
        height: 11px;
        border-radius: 9999px;
      }
      .desktop-chrome .cdot.r {
        background: #ff5f57;
      }
      .desktop-chrome .cdot.y {
        background: #febc2e;
      }
      .desktop-chrome .cdot.g {
        background: #28c840;
      }
      .desktop-chrome .url {
        flex: 1;
        background: #2a2a2a;
        color: #999;
        font-size: 12px;
        padding: 4px 12px;
        border-radius: 9999px;
        margin-left: 16px;
        font-family: var(--font-mono);
      }
      .scroll {
        max-height: 760px;
        overflow-y: auto;
      }
      /* Mobile: full phone height + scroll-snap per section.
         Each section locks into view on scroll, controlling the story. */
      .frame.mobile .scroll {
        max-height: 778px; /* 844 frame - 28 notch - ~38 padding */
        height: 778px;
        scroll-snap-type: y mandatory;
        scroll-behavior: smooth;
      }
      .frame.mobile .scroll::-webkit-scrollbar { width: 0; }
      .frame.mobile section {
        scroll-snap-align: start;
        scroll-snap-stop: always;
        min-height: 778px; /* each section fills the phone viewport */
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      /* hero already centers itself; keep its bespoke layout intact */
      .frame.mobile section.hero { justify-content: flex-start; padding-top: 56px; }
      .scroll::-webkit-scrollbar {
        width: 8px;
      }
      .scroll::-webkit-scrollbar-thumb {
        background: rgba(0, 0, 0, 0.15);
        border-radius: 9999px;
      }

      /* ============================================================
     PAGE
     ============================================================ */
      .page {
        background: var(--bg);
        color: var(--text);
      }

      /* nav — minimal, no CTA button (was the mobile crowding cause) */
      .nav {
        display: flex;
        align-items: center;
        gap: 24px;
        padding: 20px 40px;
        background: oklch(0.99 0.005 230 / 0.85);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        position: sticky;
        top: 0;
        z-index: 50;
        border-bottom: 1px solid var(--border);
      }
      .nav .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-right: auto;
      }
      .brand-mark {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        background: linear-gradient(135deg, var(--teal), var(--teal-bright));
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 12px var(--teal-tint-shadow);
      }
      .brand-name {
        font-size: 17px;
        font-weight: 700;
        letter-spacing: -0.015em;
      }
      .nav-links {
        display: flex;
        gap: 28px;
      }
      .nav-link {
        font-size: 14px;
        color: var(--text-3);
        font-weight: 500;
      }
      .nav-link:hover {
        color: var(--text);
        text-decoration: none;
      }

      /* ============ HERO — asymmetric, layered depth ============ */
      /* The wedge visualized: a chaotic list recedes into the background;
     a single What Now card rises crisp in front. */
      .hero {
        position: relative;
        padding: 120px 56px 140px;
        overflow: hidden;
        background:
          radial-gradient(
            ellipse 80% 60% at 70% 30%,
            var(--teal-soft) 0%,
            transparent 60%
          ),
          var(--bg);
      }
      .hero-grid {
        max-width: 1180px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: 1.05fr 1fr;
        gap: 64px;
        align-items: center;
        position: relative;
        z-index: 2;
      }
      .hero-eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--teal-cta);
        background: var(--teal-soft);
        padding: 6px 14px;
        border-radius: 9999px;
        margin-bottom: 28px;
      }
      .hero-eyebrow .dot {
        width: 6px;
        height: 6px;
        border-radius: 9999px;
        background: var(--teal);
      }
      .hero h1 {
        font-size: 76px;
        font-weight: 800;
        letter-spacing: -0.035em;
        line-height: 0.98;
        color: var(--text);
        margin-bottom: 24px;
      }
      .hero h1 .light {
        font-weight: 300;
        color: var(--text-3);
      }
      .hero h1 .accent {
        color: var(--teal-cta);
        font-style: italic;
        font-weight: 700;
      }
      .hero-sub {
        font-size: 20px;
        color: var(--text-3);
        line-height: 1.55;
        max-width: 30ch;
        margin-bottom: 32px;
      }
      .hero-meta {
        display: flex;
        gap: 28px;
        flex-wrap: wrap;
        font-size: 13px;
        color: var(--text-4);
      }
      .hero-meta span {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .hero-meta svg {
        color: var(--teal-cta);
      }

      /* the receding chaotic list (background depth) */
      .chaos {
        position: absolute;
        top: 80px;
        right: -100px;
        width: 400px;
        z-index: 1;
        opacity: 0.38;
        transform: rotate(5deg);
        filter: blur(1px);
        pointer-events: none;
      }
      .chaos-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 16px;
        margin-bottom: 6px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        font-size: 13px;
        color: var(--text-4);
        font-style: italic;
        box-shadow: var(--shadow-sm);
      }
      .chaos-row:nth-child(2) {
        margin-left: 28px;
        opacity: 0.7;
      }
      .chaos-row:nth-child(3) {
        margin-left: -12px;
        opacity: 0.45;
      }
      .chaos-row:nth-child(4) {
        margin-left: 36px;
        opacity: 0.25;
      }
      .chaos-row .c-box {
        width: 12px;
        height: 12px;
        border-radius: 3px;
        border: 1.5px solid var(--border-strong);
        flex-shrink: 0;
      }

      /* the What Now card (foreground, crisp) */
      .wn-wrap {
        position: relative;
        z-index: 3;
        display: flex;
        justify-content: center;
      }
      .wn-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 22px;
        padding: 44px 36px;
        box-shadow: var(--hero-shadow);
        text-align: center;
        width: 100%;
        max-width: 380px;
        position: relative;
      }
      .wn-ctx {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-size: 12px;
        color: var(--text-3);
        font-weight: 500;
        background: var(--surface-muted);
        padding: 5px 12px;
        border-radius: 9999px;
        margin-bottom: 32px;
      }
      .wn-ctx .dot {
        width: 5px;
        height: 5px;
        border-radius: 9999px;
        background: var(--teal);
      }
      .completion {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        border-radius: 9999px;
        border: 2.5px solid var(--border-strong);
        margin-bottom: 26px;
        position: relative;
        cursor: pointer;
        transition:
          transform 0.2s cubic-bezier(0.4, 0, 0.2, 1),
          border-color 0.25s ease,
          background 0.25s ease;
      }
      .completion:hover {
        transform: scale(1.08);
        border-color: var(--teal);
      }
      .completion svg.check {
        color: white;
        width: 15px;
        height: 15px;
        opacity: 0;
        transform: scale(0.3);
        transition:
          opacity 0.14s ease 0.08s,
          transform 0.26s cubic-bezier(0.34, 1.56, 0.64, 1) 0.08s;
      }
      .completion.filled {
        background: var(--teal);
        border-color: var(--teal);
        box-shadow: 0 8px 20px var(--teal-tint-shadow);
      }
      .completion.filled::before {
        animation: none;
        opacity: 0;
      }
      .completion.filled svg.check {
        opacity: 1;
        transform: scale(1);
      }
      /* celebratory burst when filled */
      .completion.burst {
        animation: burst 0.55s cubic-bezier(0.2, 0.7, 0.3, 1) both;
      }
      @keyframes burst {
        0% {
          transform: scale(1);
        }
        35% {
          transform: scale(1.25);
        }
        100% {
          transform: scale(1);
        }
      }
      .completion::before {
        content: "";
        position: absolute;
        inset: -4px;
        border-radius: 9999px;
        border: 2px solid var(--teal);
        opacity: 0.5;
        animation: halo 2.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes halo {
        0% {
          transform: scale(1);
          opacity: 0.5;
        }
        100% {
          transform: scale(1.9);
          opacity: 0;
        }
      }
      /* Honor reduced motion across the page (ethos consistency) */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
      .wn-title {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin-bottom: 8px;
      }
      .wn-meta {
        font-size: 13px;
        color: var(--text-3);
        margin-bottom: 16px;
      }
      .wn-why {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 12px;
        font-weight: 600;
        background: var(--amber-soft);
        color: var(--amber-text);
        padding: 4px 10px;
        border-radius: 6px;
        margin-bottom: 28px;
      }
      .wn-actions {
        display: flex;
        gap: 8px;
        justify-content: center;
      }
      .wn-actions .btn-primary {
        transition:
          background 0.2s ease,
          transform 0.15s ease,
          box-shadow 0.2s ease;
      }
      .wn-actions .btn-primary.done {
        background: var(--teal);
        pointer-events: none;
      }
      .btn {
        font-size: 13.5px;
        font-weight: 600;
        padding: 10px 20px;
        border-radius: 9px;
        border: 1px solid transparent;
        transition: all 0.15s;
      }
      .btn-primary {
        background: var(--teal-cta);
        color: white;
        box-shadow: 0 2px 8px var(--teal-tint-shadow);
      }
      .btn-primary:hover {
        background: var(--teal-cta-hover);
      }
      .btn-ghost {
        background: var(--surface);
        color: var(--text-2);
        border-color: var(--border-strong);
      }
      .btn-ghost:hover {
        background: var(--surface-muted);
      }

      /* ============ SECTIONS — varied spacing for rhythm ============ */
      .section {
        padding: 0 56px;
        max-width: 1180px;
        margin: 0 auto;
      }
      .eyebrow {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--teal-cta);
        margin-bottom: 18px;
      }
      .display {
        font-size: 56px;
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1.02;
        color: var(--text);
        max-width: 22ch;
        margin-bottom: 24px;
      }
      .display .light {
        font-weight: 300;
        color: var(--text-3);
      }
      .lede {
        font-size: 19px;
        color: var(--text-3);
        line-height: 1.6;
        max-width: 56ch;
        margin-bottom: 14px;
      }
      .lede b {
        color: var(--text-2);
        font-weight: 600;
      }

      /* Problem section — extra airy, off-center tension */
      .problem {
        padding-top: 160px;
        padding-bottom: 120px;
      }
      .problem .display {
        max-width: 18ch;
      }

      /* How it works — connected horizontal flow, not identical cards */
      .how {
        padding-top: 64px;
        padding-bottom: 160px;
      }
      .flow {
        margin-top: 56px;
        display: grid;
        grid-template-columns: 1fr auto 1fr auto 1fr;
        gap: 0;
        align-items: stretch;
      }
      .flow-step {
        padding: 32px 24px 0;
        position: relative;
      }
      .flow-step:first-child {
        padding-left: 0;
      }
      .flow-step:last-child {
        padding-right: 0;
      }
      .flow-num {
        font-family: var(--font-mono);
        font-size: 13px;
        font-weight: 700;
        color: var(--teal-cta);
        margin-bottom: 16px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .flow-num::before {
        content: "";
        width: 28px;
        height: 1.5px;
        background: var(--teal);
      }
      .flow-step h3 {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin-bottom: 10px;
      }
      .flow-step p {
        font-size: 15px;
        color: var(--text-3);
        line-height: 1.55;
      }
      .flow-arrow {
        display: flex;
        align-items: center;
        justify-content: center;
        padding-top: 32px;
        color: var(--border-strong);
      }

      /* Soul — large statement, lots of air */
      .soul {
        padding: 180px 56px;
        text-align: center;
        background:
          radial-gradient(
            ellipse 50% 50% at 50% 50%,
            var(--teal-soft) 0%,
            transparent 70%
          ),
          var(--bg);
      }
      .soul-statement {
        font-size: 64px;
        font-weight: 300;
        letter-spacing: -0.025em;
        line-height: 1.08;
        max-width: 18ch;
        margin: 0 auto 32px;
        color: var(--text);
      }
      .soul-statement b {
        font-weight: 800;
        color: var(--teal-cta);
        font-style: italic;
      }
      .soul-sub {
        font-size: 18px;
        color: var(--text-3);
        max-width: 50ch;
        margin: 0 auto;
        line-height: 1.55;
      }

      /* Methodology — dense, credibility-only */
      .method {
        padding-top: 120px;
        padding-bottom: 120px;
      }
      .method .display {
        font-size: 44px;
        max-width: 24ch;
      }
      .badges {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 32px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--surface);
        border: 1px solid var(--border);
        padding: 9px 16px;
        border-radius: 9999px;
        font-size: 13px;
        font-weight: 500;
        color: var(--text-2);
        box-shadow: var(--shadow-sm);
      }
      .badge .b {
        color: var(--teal-cta);
        font-weight: 700;
      }

      /* Craft — 3 rows, varied widths */
      .craft {
        padding-top: 64px;
        padding-bottom: 160px;
      }
      .craft-rows {
        margin-top: 48px;
        max-width: 760px;
      }
      .craft-row {
        display: grid;
        grid-template-columns: 48px 1fr;
        gap: 20px;
        align-items: start;
        padding: 28px 0;
        border-bottom: 1px solid var(--border);
      }
      .craft-row:first-child {
        padding-top: 0;
      }
      .craft-row:last-child {
        border-bottom: none;
      }
      .craft-icon {
        width: 44px;
        height: 44px;
        border-radius: 11px;
        background: var(--teal-soft);
        color: var(--teal-cta);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .craft-row h4 {
        font-size: 19px;
        font-weight: 700;
        margin-bottom: 4px;
        letter-spacing: -0.01em;
      }
      .craft-row p {
        font-size: 15px;
        color: var(--text-3);
        line-height: 1.5;
        max-width: 56ch;
      }

      /* FAQ */
      .faq-section {
        padding-top: 64px;
        padding-bottom: 120px;
        max-width: 760px;
      }
      .faq-list {
        margin-top: 40px;
      }
      .faq-item {
        padding: 22px 0;
        border-bottom: 1px solid var(--border);
        cursor: pointer;
      }
      .faq-item:first-child {
        border-top: 1px solid var(--border);
      }
      .faq-q {
        font-size: 18px;
        font-weight: 600;
        color: var(--text);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .faq-q::after {
        content: "+";
        color: var(--text-4);
        font-size: 18px;
        font-weight: 300;
        transition: transform 0.2s;
      }
      .faq-item.open .faq-q::after {
        transform: rotate(45deg);
      }
      .faq-a {
        font-size: 15px;
        color: var(--text-3);
        line-height: 1.6;
        margin-top: 0;
        max-height: 0;
        overflow: hidden;
        transition:
          max-height 0.25s ease,
          margin-top 0.25s ease;
      }
      .faq-item.open .faq-a {
        max-height: 200px;

    <script>
      // clone the template into both frames — single source of truth
      const tpl = document.getElementById("pageTemplate").content;
      document.getElementById("pageMobile").appendChild(tpl.cloneNode(true));
      document.getElementById("pageDesktop").appendChild(tpl.cloneNode(true));

      // ---- Interactive hero What Now card (the payoff) ----
      // Click completion circle OR "Do this" → fill with teal + checkmark →
      // celebratory burst → button becomes "Done ✓" → after 2.2s reset to a
      // fresh task. Each frame's card is independent.
      const HERO_TASKS = [
        {
          title: "Email Sarah re: Q3 invoice",
          why: "★ Important · the reason this is next",
          meta: "Due today · 15 min",
        },
        {
          title: "Review pull request #284",
          why: "Normal · fits in 30 min",
          meta: "Due today · 30 min",
        },
        {
          title: "Prep notes for 1:1 with Marco",
          why: "Low · quick win",
          meta: "Tomorrow · 10 min",
        },
        {
          title: "Reply to legal re: contract",
          why: "★ Important · overdue",
          meta: "Was due yesterday",
        },
        {
          title: "Draft the Q3 launch plan",
          why: "Important · break it down",
          meta: "This week · XL",
        },
      ];
      let heroIdx = 0;
      function resetHeroCard(card) {
        const next = HERO_TASKS[heroIdx % HERO_TASKS.length];
        heroIdx++;
        const comp = card.querySelector(".completion");
        const title = card.querySelector(".wn-title");
        const why = card.querySelector(".wn-why");
        const meta = card.querySelector(".wn-meta");
        const doBtn = card.querySelector(".wn-do");
        comp.classList.remove("filled", "burst");
        title.textContent = next.title;
        why.textContent = next.why;
        meta.textContent = next.meta;
        doBtn.classList.remove("done");
        doBtn.textContent = "Do this";
      }
      function fillHeroCard(card) {
        const comp = card.querySelector(".completion");
        const doBtn = card.querySelector(".wn-do");
        if (comp.classList.contains("filled")) return; // already done, wait for reset
        comp.classList.add("filled", "burst");
        doBtn.classList.add("done");
        doBtn.textContent = "Done ✓";
        setTimeout(() => {
          comp.classList.remove("burst");
          // fade out, swap, fade in
          card.style.transition = "opacity .3s ease";
          card.style.opacity = "0.35";
          setTimeout(() => {
            resetHeroCard(card);
            card.style.opacity = "1";
          }, 300);
        }, 2200);
      }
      document.addEventListener("click", (e) => {
        // completion circle click
        if (e.target.closest(".completion")) {
          const card = e.target.closest(".wn-card");
          if (card) fillHeroCard(card);
          return;
        }
        // "Do this" button click
        const doBtn = e.target.closest(".wn-do");
        if (doBtn) {
          const card = doBtn.closest(".wn-card");
          if (card) fillHeroCard(card);
          return;
        }
      });

      // FAQ expand/collapse (delegated across both clones)
      document.addEventListener("click", (e) => {
        const item = e.target.closest(".faq-item");
        if (!item) return;
        item.classList.toggle("open");
      });

      // nav-link smooth scroll (both clones)
      document.addEventListener("click", (e) => {
        const link = e.target.closest(".nav-link");
        if (!link) return;
        const id = link.getAttribute("href");
        if (!id || !id.startsWith("#")) return;
        const root = link.closest(".page");
        const target = root.querySelector(id);
        if (target) {
          e.preventDefault();
          target.scrollIntoView({ behavior: "smooth", block: "start" });
        }
      });
    </script>
