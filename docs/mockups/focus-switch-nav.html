<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ActionAmp — Focus-Switch Prototype</title>
<style>
/* ---- Design tokens (from tokens.css) ---- */
:root {
  --aa-font: ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
  --aa-font-mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  --aa-teal: oklch(0.72 0.15 220);
  --aa-teal-cta: oklch(0.58 0.16 225);
  --aa-teal-cta-hover: oklch(0.5 0.16 228);
  --aa-teal-soft: oklch(0.95 0.04 220);
  --aa-teal-soft-strong: oklch(0.9 0.07 220);
  --aa-teal-tint-shadow: oklch(0.58 0.16 225 / 0.22);
  --aa-amber: oklch(0.78 0.16 70);
  --aa-amber-text: oklch(0.45 0.13 65);
  --aa-amber-soft: oklch(0.95 0.06 75);
  --aa-violet: oklch(0.62 0.2 295);
  --aa-violet-soft: oklch(0.95 0.04 295);
  --aa-violet-text: oklch(0.45 0.15 295);
  --aa-rose: oklch(0.6 0.18 15);
  --aa-rose-soft: oklch(0.95 0.04 15);
  --aa-bg: oklch(0.99 0.005 230);
  --aa-bg-soft: oklch(0.97 0.008 230);
  --aa-bg-deep: oklch(0.94 0.01 230);
  --aa-surface: oklch(1 0.003 230);
  --aa-surface-muted: oklch(0.96 0.008 230);
  --aa-surface-muted-2: oklch(0.93 0.01 230);
  --aa-border: oklch(0.91 0.01 230);
  --aa-border-strong: oklch(0.86 0.012 230);
  --aa-text: oklch(0.2 0.015 230);
  --aa-text-2: oklch(0.36 0.015 230);
  --aa-text-3: oklch(0.5 0.015 230);
  --aa-text-4: oklch(0.62 0.012 230);
  --aa-radius-sm: 6px;
  --aa-radius-md: 8px;
  --aa-radius-lg: 12px;
  --aa-radius-xl: 18px;
  --aa-space-xs: 4px;
  --aa-space-sm: 8px;
  --aa-space-md: 16px;
  --aa-space-lg: 24px;
  --aa-space-xl: 32px;
  --aa-shadow-md: 0 2px 6px oklch(0.2 0.02 230 / 0.06), 0 12px 32px oklch(0.2 0.02 230 / 0.06);
  --aa-shadow-lg: 0 4px 12px oklch(0.2 0.02 230 / 0.06), 0 32px 80px oklch(0.2 0.02 230 / 0.1);
  --aa-ease-out: cubic-bezier(0.4, 0, 0.2, 1);
  --aa-ease-out-quart: cubic-bezier(0.2, 0.7, 0.3, 1);
  --aa-dur-fast: 0.12s;
  --aa-dur-base: 0.2s;
  --aa-dur-slow: 0.4s;
}

[data-theme="dark"] {
  --aa-bg: oklch(0.16 0.01 230);
  --aa-bg-soft: oklch(0.19 0.012 230);
  --aa-bg-deep: oklch(0.13 0.01 230);
  --aa-surface: oklch(0.21 0.012 230);
  --aa-surface-muted: oklch(0.24 0.014 230);
  --aa-surface-muted-2: oklch(0.28 0.015 230);
  --aa-border: oklch(0.3 0.015 230);
  --aa-border-strong: oklch(0.38 0.018 230);
  --aa-text: oklch(0.95 0.01 230);
  --aa-text-2: oklch(0.78 0.012 230);
  --aa-text-3: oklch(0.62 0.012 230);
  --aa-text-4: oklch(0.5 0.012 230);
  --aa-teal-soft: oklch(0.3 0.06 220);
  --aa-teal-soft-strong: oklch(0.35 0.08 220);
  --aa-amber-soft: oklch(0.3 0.07 75);
  --aa-violet-soft: oklch(0.3 0.07 295);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--aa-font);
  background: var(--aa-bg);
  color: var(--aa-text);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* ---- App shell ---- */
.aa-shell {
  display: grid;
  grid-template-columns: 248px 1fr;
  height: 100vh;
}

/* ---- Sidebar ---- */
.aa-sidebar {
  background: var(--aa-bg-soft);
  border-right: 1px solid var(--aa-border);
  display: flex;
  flex-direction: column;
  padding: var(--aa-space-md);
  gap: var(--aa-space-md);
  overflow-y: auto;
}

.aa-brand {
  display: flex;
  align-items: center;
  gap: var(--aa-space-sm);
  font-weight: 700;
  font-size: 1rem;
  letter-spacing: -0.01em;
  padding: var(--aa-space-xs) var(--aa-space-xs);
}
.aa-brand-mark {
  width: 24px; height: 24px;
  border-radius: var(--aa-radius-sm);
  background: linear-gradient(135deg, var(--aa-teal), var(--aa-teal-cta));
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 8px var(--aa-teal-tint-shadow);
}
.aa-brand-mark svg { width: 14px; height: 14px; }

/* ---- Lens switch (context) ---- */
.aa-lens {
  display: flex;
  background: var(--aa-surface-muted);
  border-radius: var(--aa-radius-lg);
  padding: 3px;
  gap: 2px;
}
.aa-lens-btn {
  flex: 1;
  border: none;
  background: transparent;
  padding: 7px 12px;
  border-radius: var(--aa-radius-md);
  font-family: inherit;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--aa-text-3);
  cursor: pointer;
  transition: all var(--aa-dur-fast) var(--aa-ease-out);
}
.aa-lens-btn.active {
  background: var(--aa-surface);
  color: var(--aa-text);
  box-shadow: 0 1px 3px oklch(0.2 0.02 230 / 0.08);
}

/* ---- Focus nav (expanding sections) ---- */
.aa-focus {
  display: flex;
  flex-direction: column;
  gap: 2px;
  flex: 1;
}
.aa-focus-section {
  border-radius: var(--aa-radius-md);
  overflow: hidden;
}
.aa-focus-header {
  width: 100%;
  display: flex;
  align-items: center;
  gap: var(--aa-space-sm);
  padding: 9px 12px;
  border: none;
  background: transparent;
  font-family: inherit;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--aa-text-3);
  cursor: pointer;
  border-radius: var(--aa-radius-md);
  transition: all var(--aa-dur-fast) var(--aa-ease-out);
  text-align: left;
}
.aa-focus-header:hover { background: var(--aa-surface-muted); color: var(--aa-text-2); }
.aa-focus-section.open .aa-focus-header {
  color: var(--aa-text);
}
.aa-focus-chevron {
  margin-left: auto;
  transition: transform var(--aa-dur-base) var(--aa-ease-out);
  opacity: 0.5;
  font-size: 0.7rem;
}
.aa-focus-section.open .aa-focus-chevron { transform: rotate(90deg); }
.aa-focus-items {
  max-height: 0;
  overflow: hidden;
  transition: max-height var(--aa-dur-base) var(--aa-ease-out);
  padding-left: var(--aa-space-md);
}
.aa-focus-section.open .aa-focus-items { max-height: 300px; }
.aa-nav-item {
  display: flex;
  align-items: center;
  gap: var(--aa-space-sm);
  padding: 7px 12px;
  border: none;
  background: transparent;
  font-family: inherit;
  font-size: 0.85rem;
  color: var(--aa-text-3);
  cursor: pointer;
  border-radius: var(--aa-radius-sm);
  transition: all var(--aa-dur-fast) var(--aa-ease-out);
  text-align: left;
  width: 100%;
}
.aa-nav-item:hover { background: var(--aa-surface-muted); color: var(--aa-text); }
.aa-nav-item.active {
  color: var(--aa-teal-cta);
  background: var(--aa-teal-soft);
  font-weight: 600;
}
.aa-nav-item .count {
  margin-left: auto;
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--aa-text-4);
}
.aa-nav-item.active .count { color: var(--aa-teal); }

/* ---- Sidebar footer ---- */
.aa-sidebar-foot {
  display: flex;
  align-items: center;
  gap: var(--aa-space-sm);
  padding: var(--aa-space-sm);
  border-top: 1px solid var(--aa-border);
}
.aa-avatar {
  width: 28px; height: 28px;
  border-radius: var(--aa-radius-full);
  background: var(--aa-violet);
  color: white;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.75rem;
  font-weight: 700;
}
.aa-sidebar-foot span { font-size: 0.85rem; color: var(--aa-text-2); }

/* ---- Main area ---- */
.aa-main {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.aa-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--aa-space-md) var(--aa-space-xl);
  border-bottom: 1px solid var(--aa-border);
}
.aa-topbar-capture {
  display: flex;
  align-items: center;
  gap: var(--aa-space-sm);
  padding: 8px 14px;
  background: var(--aa-surface-muted);
  border: 1px solid var(--aa-border);
  border-radius: var(--aa-radius-md);
  color: var(--aa-text-3);
  font-size: 0.85rem;
  cursor: pointer;
  transition: all var(--aa-dur-fast) var(--aa-ease-out);
}
.aa-topbar-capture:hover { border-color: var(--aa-teal); color: var(--aa-text); }
.aa-topbar-capture kbd {
  font-family: var(--aa-font-mono);
  font-size: 0.75rem;
  background: var(--aa-surface);
  border: 1px solid var(--aa-border);
  border-radius: var(--aa-radius-xs);
  padding: 1px 5px;
  color: var(--aa-text-3);
}
.aa-topbar-actions { display: flex; gap: var(--aa-space-sm); }
.aa-icon-btn {
  border: 1px solid var(--aa-border);
  background: var(--aa-surface);
  border-radius: var(--aa-radius-md);
  width: 34px; height: 34px;
  cursor: pointer;
  color: var(--aa-text-3);
  font-size: 0.9rem;
  display: flex; align-items: center; justify-content: center;
  transition: all var(--aa-dur-fast) var(--aa-ease-out);
}
.aa-icon-btn:hover { color: var(--aa-text); border-color: var(--aa-border-strong); }

.aa-content {
  flex: 1;
  overflow-y: auto;
  padding: var(--aa-space-xl) var(--aa-space-2xl);
}

/* ---- What Now (home) ---- */
.aa-wn { max-width: 540px; margin: 0 auto; text-align: center; padding-top: var(--aa-space-2xl); }
.aa-wn-eyebrow {
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--aa-teal-cta);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: var(--aa-space-md);
}
.aa-wn-card {
  background: var(--aa-surface);
  border: 1px solid var(--aa-border);
  border-radius: var(--aa-radius-xl);
  padding: var(--aa-space-xl);
  box-shadow: var(--aa-shadow-md);
}
.aa-wn-title {
  font-size: 1.5rem;
  font-weight: 700;
  letter-spacing: -0.01em;
  margin: var(--aa-space-md) 0 var(--aa-space-sm);
}
.aa-wn-meta {
  font-size: 0.85rem;
  color: var(--aa-text-3);
  margin-bottom: var(--aa-space-md);
}
.aa-wn-why {
  font-size: 0.85rem;
  color: var(--aa-text-2);
  padding: var(--aa-space-sm) var(--aa-space-md);
  background: var(--aa-amber-soft);
  border-radius: var(--aa-radius-md);
  margin-bottom: var(--aa-space-lg);
}
.aa-wn-why strong { color: var(--aa-amber-text); }
.aa-wn-actions {
  display: flex;
  gap: var(--aa-space-sm);
  justify-content: center;
}
.aa-btn {
  border: none;
  font-family: inherit;
  font-size: 0.9rem;
  font-weight: 600;
  padding: 10px 20px;
  border-radius: var(--aa-radius-md);
  cursor: pointer;
  transition: all var(--aa-dur-fast) var(--aa-ease-out);
}
.aa-btn-primary {
  background: var(--aa-teal-cta);
  color: white;
  box-shadow: 0 4px 12px var(--aa-teal-tint-shadow);
}
.aa-btn-primary:hover { background: var(--aa-teal-cta-hover); }
.aa-btn-secondary {
  background: var(--aa-surface);
  color: var(--aa-text-2);
  border: 1px solid var(--aa-border);
}
.aa-btn-secondary:hover { border-color: var(--aa-border-strong); color: var(--aa-text); }
.aa-btn-ghost {
  background: transparent;
  color: var(--aa-text-3);
  border: none;
  padding: 6px 12px;
  font-size: 0.8rem;
}
.aa-btn-ghost:hover { color: var(--aa-text); background: var(--aa-surface-muted); }
.aa-btn-sm { padding: 5px 12px; font-size: 0.8rem; }

/* ---- Today / Upcoming views ---- */
.aa-list { max-width: 640px; margin: 0 auto; }
.aa-list-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--aa-space-lg);
}
.aa-list-eyebrow { font-size: 0.75rem; font-weight: 600; color: var(--aa-text-3); text-transform: uppercase; letter-spacing: 0.05em; }
.aa-list-title { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.01em; margin-top: 2px; }

.aa-task-row {
  display: flex;
  align-items: center;
  gap: var(--aa-space-sm);
  padding: 12px 0;
  border-bottom: 1px solid var(--aa-border);
}
.aa-task-row:last-child { border-bottom: none; }
.aa-task-row > .aa-cc { flex-shrink: 0; }
.aa-task-main { flex: 1; min-width: 0; }
.aa-task-title { font-size: 0.95rem; }
.aa-task-meta { font-size: 0.75rem; color: var(--aa-text-4); margin-top: 2px; }
.aa-task-row.muted .aa-task-title { color: var(--aa-text-3); }

.aa-cc {
  width: 22px; height: 22px;
  border: 1.5px solid var(--aa-border-strong);
  border-radius: var(--aa-radius-full);
  cursor: pointer;
  transition: all var(--aa-dur-fast) var(--aa-ease-out);
  flex-shrink: 0;
}
.aa-cc:hover { border-color: var(--aa-teal); }
.aa-cc.filled { background: var(--aa-teal-cta); border-color: var(--aa-teal-cta); }
.aa-cc.filled::after { content: "✓"; color: white; font-size: 0.7rem; display: flex; align-items: center; justify-content: center; height: 100%; font-weight: 700; }

.aa-chip {
  display: inline-flex;
  align-items: center;
  font-size: 0.7rem;
  padding: 2px 8px;
  border-radius: var(--aa-radius-full);
  font-weight: 600;
}
.aa-chip-teal { background: var(--aa-teal-soft); color: var(--aa-teal-cta); }
.aa-chip-amber { background: var(--aa-amber-soft); color: var(--aa-amber-text); }
.aa-chip-violet { background: var(--aa-violet-soft); color: var(--aa-violet-text); }

.aa-upcoming-empty { text-align: center; color: var(--aa-text-3); padding: var(--aa-space-xl); font-size: 0.9rem; }

/* ---- Note strip ---- */
.aa-note {
  position: fixed;
  bottom: var(--aa-space-md);
  right: var(--aa-space-md);
  background: var(--aa-amber-soft);
  color: var(--aa-amber-text);
  padding: 10px 16px;
  border-radius: var(--aa-radius-md);
  font-size: 0.8rem;
  max-width: 280px;
  box-shadow: var(--aa-shadow-md);
  line-height: 1.4;
}
.aa-note strong { display: block; margin-bottom: 2px; }
</style>
</head>
<body>

<div class="aa-shell">
  <!-- ============ SIDEBAR ============ -->
  <aside class="aa-sidebar">
    <div class="aa-brand">
      <div class="aa-brand-mark">
        <svg viewBox="0 0 16 16" fill="none"><path d="M3.5 8.5l3 3 6-7" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      ActionAmp
    </div>

    <!-- Context switch (Lens) — always available, orthogonal to focus -->
    <div class="aa-lens">
      <button class="aa-lens-btn active" onclick="alert('Lens switch = context (Work/Me). Orthogonal to focus.')">Work</button>
      <button class="aa-lens-btn" onclick="alert('Lens switch = context (Work/Me). Orthogonal to focus.')">Me</button>
    </div>

    <!-- Focus nav — expanding sections, one open at a time -->
    <nav class="aa-focus" id="focusNav">

      <div class="aa-focus-section open" data-section="work">
        <button class="aa-focus-header" onclick="toggleSection('work')">
          <span>▸</span> Work
          <span class="aa-focus-chevron">▸</span>
        </button>
        <div class="aa-focus-items">
          <button class="aa-nav-item active" data-view="what-now" onclick="showView('what-now')">
            Next
          </button>
          <button class="aa-nav-item" data-view="today" onclick="showView('today')">
            Today <span class="count">3</span>
          </button>
        </div>
      </div>

      <div class="aa-focus-section" data-section="plan">
        <button class="aa-focus-header" onclick="toggleSection('plan')">
          <span>▸</span> Plan
          <span class="aa-focus-chevron">▸</span>
        </button>
        <div class="aa-focus-items">
          <button class="aa-nav-item" data-view="projects" onclick="showView('projects')">
            Projects <span class="count">4</span>
          </button>
          <button class="aa-nav-item" data-view="goals" onclick="showView('goals')">
            Goals <span class="count">2</span>
          </button>
          <button class="aa-nav-item" data-view="someday" onclick="showView('someday')">
            Someday <span class="count">7</span>
          </button>
        </div>
      </div>

      <div class="aa-focus-section" data-section="review">
        <button class="aa-focus-header" onclick="toggleSection('review')">
          <span>▸</span> Review
          <span class="aa-focus-chevron">▸</span>
        </button>
        <div class="aa-focus-items">
          <button class="aa-nav-item" data-view="logbook" onclick="showView('logbook')">
            Logbook
          </button>
          <button class="aa-nav-item" data-view="stats" onclick="showView('stats')">
            Stats
          </button>
        </div>
      </div>

    </nav>

    <div class="aa-sidebar-foot">
      <div class="aa-avatar">ZD</div>
      <span>Zeljko Dakic</span>
    </div>
  </aside>

  <!-- ============ MAIN ============ -->
  <main class="aa-main">
    <div class="aa-topbar">
      <div class="aa-topbar-capture" onclick="alert('Capture (⌘K) — pervasive. Pinned outside both switches.')">
        Capture <kbd>⌘K</kbd>
      </div>
      <div class="aa-topbar-actions">
        <button class="aa-icon-btn" title="Shortcuts (?)">?</button>
        <button class="aa-icon-btn" id="themeBtn" title="Toggle theme" onclick="toggleTheme()">◐</button>
      </div>
    </div>

    <div class="aa-content" id="content">
      <!-- Views render here via JS -->
    </div>
  </main>
</div>

<div class="aa-note">
  <strong>Prototype — click around</strong>
  Focus sections expand/collapse (one open at a time). The Today view has the Upcoming swap. What Now shows Next → Now.
</div>

<script>
// ---- Focus nav: expanding sections (one open at a time) ----
function toggleSection(name) {
  const sections = document.querySelectorAll('.aa-focus-section');
  sections.forEach(s => {
    if (s.dataset.section === name) s.classList.toggle('open');
    else s.classList.remove('open');
  });
}

// ---- View state ----
let todayTasks = [
  { id: 1, title: 'Email Sarah re: Q3 invoice', meta: 'Work · 15m', chips: [{t:'★',c:'amber'},{t:'Work',c:'violet'}] },
  { id: 2, title: 'Review PR #234', meta: 'Work · 30m', chips: [{t:'Work',c:'violet'}] },
  { id: 3, title: 'Draft launch announcement', meta: 'Ship v2 · 1hr', chips: [{t:'Ship v2',c:'violet'}] },
];
let upcomingTasks = [
  { id: 4, title: 'Call the accountant', meta: 'Work · 15m', chips: [] },
  { id: 5, title: 'Update landing page copy', meta: 'Marketing · 30m', chips: [{t:'Marketing',c:'violet'}] },
  { id: 6, title: 'Plan team offsite', meta: 'Work · XL', chips: [] },
];
let wnState = 'next'; // 'next' or 'now'
let todayView = 'today'; // 'today' or 'upcoming'

// ---- Render views ----
function showView(view) {
  // Update nav active state
  document.querySelectorAll('.aa-nav-item').forEach(n => n.classList.remove('active'));
  const btn = document.querySelector(`[data-view="${view}"]`);
  if (btn) btn.classList.add('active');

  const c = document.getElementById('content');
  if (view === 'what-now') c.innerHTML = renderWhatNow();
  else if (view === 'today') { todayView = 'today'; c.innerHTML = renderToday(); }
  else if (view === 'projects') c.innerHTML = renderProjects();
  else if (view === 'goals') c.innerHTML = renderGoals();
  else if (view === 'someday') c.innerHTML = renderSomeday();
  else if (view === 'logbook') c.innerHTML = renderLogbook();
  else if (view === 'stats') c.innerHTML = renderStats();
}

function chipHTML(chips) {
  return (chips||[]).map(c => `<span class="aa-chip aa-chip-${c.c}">${c.t}</span>`).join(' ');
}

function renderWhatNow() {
  const task = todayTasks[0];
  if (!task) return `<div class="aa-wn"><div class="aa-wn-eyebrow">Next</div><h2>Nothing on the table.</h2></div>`;
  const isNow = wnState === 'now';
  return `
    <div class="aa-wn">
      <div class="aa-wn-eyebrow">${isNow ? 'Now' : 'Next'} · Work</div>
      <div class="aa-wn-card">
        <div style="font-size:0.8rem;color:var(--aa-text-3);margin-bottom:8px">${isNow ? 'You started this' : 'The one thing'}</div>
        <h2 class="aa-wn-title">${task.title}</h2>
        <div class="aa-wn-meta">${task.meta}</div>
        <div class="aa-wn-why">Because it's <strong>Important and due today</strong>.</div>
        <div class="aa-wn-actions">
          ${isNow
            ? `<button class="aa-btn aa-btn-primary" onclick="wnDo()">Do this</button>
               <button class="aa-btn aa-btn-secondary" onclick="wnPause()">Pause</button>`
            : `<button class="aa-btn aa-btn-primary" onclick="wnStart()">Start</button>
               <button class="aa-btn aa-btn-secondary" onclick="alert('Snooze sheet would open (1h / 3h / tomorrow / weekend / someday)')">Not now</button>`
          }
        </div>
      </div>
    </div>`;
}

function renderToday() {
  if (todayView === 'upcoming') {
    return `
      <div class="aa-list">
        <div class="aa-list-header">
          <div><div class="aa-list-eyebrow">Bench</div><h1 class="aa-list-title">Upcoming</h1></div>
          <button class="aa-btn aa-btn-secondary aa-btn-sm" onclick="swapTo('today')">Back to Today</button>
        </div>
        ${upcomingTasks.length === 0
          ? `<p class="aa-upcoming-empty">Nothing on the bench. Snooze a task and it'll show up here.</p>`
          : upcomingTasks.map(t => `
              <div class="aa-task-row">
                <div class="aa-cc"></div>
                <div class="aa-task-main">
                  <div class="aa-task-title">${t.title}</div>
                  <div class="aa-task-meta">${t.meta} ${chipHTML(t.chips)}</div>
                </div>
                <button class="aa-btn aa-btn-secondary aa-btn-sm" onclick="promote(${t.id})">Today</button>
              </div>`).join('')
        }
      </div>`;
  }
  return `
    <div class="aa-list">
      <div class="aa-list-header">
        <div><div class="aa-list-eyebrow">Today</div><h1 class="aa-list-title">${todayTasks.length} of 5 committed</h1></div>
        <button class="aa-btn aa-btn-secondary aa-btn-sm" onclick="swapTo('upcoming')">See upcoming</button>
      </div>
      ${todayTasks.length === 0
        ? `<p class="aa-upcoming-empty">Nothing today. Pull one in from Upcoming, or triage something from the Inbox.</p>`
        : todayTasks.map(t => `
            <div class="aa-task-row">
              <div class="aa-cc" onclick="this.classList.toggle('filled')"></div>
              <div class="aa-task-main">
                <div class="aa-task-title">${t.title}</div>
                <div class="aa-task-meta">${t.meta} ${chipHTML(t.chips)}</div>
              </div>
              <button class="aa-btn aa-btn-ghost aa-btn-sm" onclick="demote(${t.id})">Not today</button>
            </div>`).join('')
      }
    </div>`;
}

function renderProjects() {

    <div class="aa-task-row"><div class="aa-cc"></div><div class="aa-task-main"><div class="aa-task-title">Q3 planning</div><div class="aa-task-meta">No next action</div></div></div>

    <div class="aa-task-row muted"><div class="aa-cc"></div><div class="aa-task-main"><div class="aa-task-title">Learn Rust</div></div></div>

    <div class="aa-task-row muted"><div class="aa-cc filled"></div><div class="aa-task-main"><div class="aa-task-title">Fix login bug</div><div class="aa-task-meta">Done today, 2:14pm</div></div></div>
    <div class="aa-task-row muted"><div class="aa-cc filled"></div><div class="aa-task-main"><div class="aa-task-title">Reply to Marc</div><div class="aa-task-meta">Done today, 11:02am</div></div></div>
    <div class="aa-task-row muted"><div class="aa-cc filled"></div><div class="aa-task-main"><div class="aa-task-title">Update dependencies</div><div class="aa-task-meta">Done yesterday</div></div></div>
  </div>`;

function renderStats() {
  return `<div class="aa-list"><div class="aa-list-header"><div><div class="aa-list-eyebrow">Review</div><h1 class="aa-list-title">This week</h1></div></div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px">
      <div style="text-align:center;padding:24px;background:var(--aa-surface);border-radius:12px;border:1px solid var(--aa-border)"><div style="font-size:2rem;font-weight:700;color:var(--aa-teal-cta)">12</div><div style="font-size:0.8rem;color:var(--aa-text-3)">completed</div></div>
      <div style="text-align:center;padding:24px;background:var(--aa-surface);border-radius:12px;border:1px solid var(--aa-border)"><div style="font-size:2rem;font-weight:700;color:var(--aa-text-2)">3</div><div style="font-size:0.8rem;color:var(--aa-text-3)">on Today</div></div>
      <div style="text-align:center;padding:24px;background:var(--aa-surface);border-radius:12px;border:1px solid var(--aa-border)"><div style="font-size:2rem;font-weight:700;color:var(--aa-amber-text)">5</div><div style="font-size:0.8rem;color:var(--aa-text-3)">deferred</div></div>
    </div>
    <p style="color:var(--aa-text-3);margin-top:24px;font-size:0.85rem">Net-new area. The Logbook feeds these reports.</p>
  </div>`;
}

// ---- What Now actions ----
function wnStart() { wnState = 'now'; showView('what-now'); }
function wnPause() { wnState = 'next'; showView('what-now'); }
function wnDo() { alert('"Do this" enters focus mode (full-screen single-task).'); }

// ---- Today ↔ Upcoming swap ----
function swapTo(view) { todayView = view; document.getElementById('content').innerHTML = renderToday(); }
function promote(id) {
  const t = upcomingTasks.find(x => x.id === id);
  upcomingTasks = upcomingTasks.filter(x => x.id !== id);
  todayTasks.push(t);
  document.getElementById('content').innerHTML = renderToday();
}
function demote(id) {
  const t = todayTasks.find(x => x.id === id);
  todayTasks = todayTasks.filter(x => x.id !== id);
  upcomingTasks.unshift(t);
  document.getElementById('content').innerHTML = renderToday();
}

// ---- Theme ----
function toggleTheme() {
  const html = document.documentElement;
  html.dataset.theme = html.dataset.theme === 'dark' ? 'light' : 'dark';
}

// ---- Init ----
showView('what-now');
</script>
