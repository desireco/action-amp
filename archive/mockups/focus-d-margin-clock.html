<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Focus · D · Margin Clock</title>
<style>
/* ActionAmp design tokens — inlined from tokens.css */
/* ActionAmp tokens — pulled verbatim from webapp/src/styles/tokens.css */
:root {
  --aa-teal: oklch(0.72 0.15 220);
  --aa-teal-bright: oklch(0.78 0.14 215);
  --aa-teal-cta: oklch(0.58 0.16 225);
  --aa-teal-cta-hover: oklch(0.5 0.16 228);
  --aa-teal-soft: oklch(0.95 0.04 220);
  --aa-teal-soft-strong: oklch(0.9 0.07 220);
  --aa-teal-tint-shadow: oklch(0.58 0.16 225 / 0.22);

  --aa-amber: oklch(0.78 0.16 70);
  --aa-amber-text: oklch(0.45 0.13 65);
  --aa-amber-soft: oklch(0.95 0.06 75);

  --aa-bg: oklch(0.99 0.005 230);
  --aa-surface: oklch(1 0.003 230);
  --aa-border: oklch(0.91 0.01 230);
  --aa-border-strong: oklch(0.86 0.012 230);

  --aa-text: oklch(0.2 0.015 230);
  --aa-text-2: oklch(0.36 0.013 230);
  --aa-text-3: oklch(0.5 0.012 230);
  --aa-text-4: oklch(0.62 0.01 230);

  --aa-radius-sm: 6px;
  --aa-radius-md: 8px;
  --aa-radius-lg: 12px;
  --aa-radius-xl: 18px;
  --aa-radius-full: 9999px;

  --aa-shadow-sm: 0 1px 2px oklch(0.25 0.015 230 / 0.06), 0 1px 1px oklch(0.25 0.015 230 / 0.04);
  --aa-shadow-md: 0 4px 12px oklch(0.25 0.015 230 / 0.08), 0 2px 4px oklch(0.25 0.015 230 / 0.04);
  --aa-hero-shadow: 0 12px 32px oklch(0.25 0.015 230 / 0.08), 0 40px 96px var(--aa-teal-tint-shadow);

  --aa-ease-out: cubic-bezier(0.4,0,0.2,1);
  --aa-ease-out-quart: cubic-bezier(0.2,0.7,0.3,1);
  --aa-ease-spring: cubic-bezier(0.34,1.56,0.64,1);

  --aa-font: ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", Roboto, sans-serif;
  --aa-font-mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: var(--aa-font);
  color: var(--aa-text);
  background: var(--aa-bg);
  -webkit-font-smoothing: antialiased;
}
</style>
<style>
  /* ============================================================
     VARIANT D · MARGIN CLOCK
     A's calm hero stays the hero. The clock is relocated OFF the
     central axis entirely — it lives in the top-left corner as a
     small peripheral line, the way a kitchen clock does.

     Principle: a focus timer should be a GLANCE element, not a
     STARE element. You look up to check it, then your eye returns
     to the work. It must never sit on the line between your eye
     and the title.

     Differences from A:
       - elapsed time moves from the central column → top-left corner
       - the central column is now ONLY about the task
       - a faint session "footprint" (start time) sits top-right
       - the completion circle stays centered, alone with the title

     Differences from B:
       - NO ring around the circle. The circle is the completion
         affordance, not a clock. Conflating them was B's mistake.
     ============================================================ */

  .aa-focus {
    position: fixed; inset: 0; z-index: 100;
    background: var(--aa-bg);
    display: flex; flex-direction: column;
    animation: aa-fade 0.4s var(--aa-ease-out-quart);
  }
  @keyframes aa-fade { from { opacity: 0 } to { opacity: 1 } }

  /* Top bar — now holds the clock in the left margin.
     This is the key move: the clock is in the chrome, not the body. */
  .aa-focus__top {
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 24px 32px;
  }

  /* THE MARGIN CLOCK.
     Small, monospaced numeric, sits in the corner.
     Reads like a wall clock: present, but not demanding.
     The label "min in" is intentionally lighter weight than the number
     so the eye grabs the magnitude first. */
  .aa-clock {
    display: flex; flex-direction: column; gap: 2px;
    line-height: 1;
  }
  .aa-clock__row {
    display: inline-flex; align-items: baseline; gap: 6px;
  }
  .aa-clock__num {
    font-family: var(--aa-font);
    font-size: 22px; font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--aa-text-2);
    letter-spacing: -0.02em;
  }
  .aa-clock__unit {
    font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--aa-text-4);
  }
  .aa-clock__label {
    font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--aa-text-4);
    margin-top: 4px;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .aa-clock__label .dot {
    width: 5px; height: 5px; border-radius: var(--aa-radius-full);
    background: var(--aa-teal);
    animation: breathe-dot 4s var(--aa-ease-out-quart) infinite;
  }
  @keyframes breathe-dot {
    0%, 100% { opacity: 0.4; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.2); }
  }

  /* Right side: session footprint — when this started.
     Smaller still, deliberately quiet. */
  .aa-focus__top-right {
    display: flex; flex-direction: column; align-items: flex-end; gap: 10px;
  }
  .aa-session {
    font-size: 11px; font-weight: 500;
    color: var(--aa-text-4);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
  }
  .aa-session__sep { color: var(--aa-border-strong); margin: 0 6px; }

  .aa-close {
    width: 32px; height: 32px;
    display: inline-flex; align-items: center; justify-content: center;
    border: none; background: transparent;
    color: var(--aa-text-3);
    border-radius: var(--aa-radius-full);
    cursor: pointer;
    transition: background 0.2s var(--aa-ease-out), color 0.2s var(--aa-ease-out);
  }
  .aa-close:hover { background: var(--aa-surface); color: var(--aa-text); }
  .aa-close svg { width: 16px; height: 16px; }

  /* Body — the central column is now ONLY about the task.
     Circle → title → meta → notes. No clock anywhere in this column. */
  .aa-focus__body {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 0 32px 64px;
    text-align: center;
    gap: 32px;
  }

  .aa-presence {
    position: relative;
    width: 132px; height: 132px;
    display: grid; place-items: center;
  }
  .aa-presence__halo {
    position: absolute; inset: 0;
    border-radius: var(--aa-radius-full);
    background: radial-gradient(circle at 50% 50%,
      var(--aa-teal-tint-shadow) 0%,
      transparent 70%);
    animation: breathe-halo 5s var(--aa-ease-out-quart) infinite;
    pointer-events: none;
  }
  @keyframes breathe-halo {
    0%, 100% { transform: scale(0.85); opacity: 0.45; }
    50%      { transform: scale(1.08); opacity: 0.9; }
  }

  /* The completion circle, with NO clock ring around it.
     It is purely the completion affordance, alone. */
  .aa-presence__circle {
    position: relative; z-index: 1;
    width: 88px; height: 88px;
    border-radius: var(--aa-radius-full);
    border: 3px solid var(--aa-border-strong);
    background: var(--aa-surface);
    box-shadow: var(--aa-shadow-md);
    cursor: pointer;
    display: grid; place-items: center;
    transition: border-color 0.2s var(--aa-ease-out),
                background 0.2s var(--aa-ease-out),
                transform 0.18s var(--aa-ease-spring);
  }
  .aa-presence__circle:hover {
    border-color: var(--aa-teal);
    background: var(--aa-teal-soft);
    transform: scale(1.02);
  }
  .aa-presence__circle:active { transform: scale(0.97); }
  .aa-presence__circle svg {
    width: 28px; height: 28px;
    opacity: 0;
    transition: opacity 0.18s var(--aa-ease-out);
    stroke: var(--aa-teal-cta);
  }
  .aa-presence__circle:hover svg { opacity: 0.45; }

  .aa-title {
    font-size: clamp(1.625rem, 3.2vw, 2.125rem);
    font-weight: 700;
    line-height: 1.18;
    letter-spacing: -0.015em;
    color: var(--aa-text);
    max-width: 620px;
    margin: 0;
  }

  .aa-meta {
    font-size: 13px;
    color: var(--aa-text-3);
    display: inline-flex; align-items: center; gap: 8px;
    flex-wrap: wrap; justify-content: center;
    margin-top: -16px;
  }
  .aa-meta__sep { color: var(--aa-text-4); }

  .aa-below {
    width: 100%; max-width: 620px;
    display: flex; flex-direction: column; gap: 16px;
    margin-top: 0;
  }
  .aa-notes {
    background: var(--aa-surface);
    border: 1px solid var(--aa-border);
    border-radius: var(--aa-radius-lg);
    padding: 14px 16px;
    text-align: left;
  }
  .aa-notes__label {
    font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--aa-text-4);
    margin-bottom: 8px;
  }
  .aa-notes__body {
    font-size: 14px; line-height: 1.5;
    color: var(--aa-text-2);
    white-space: pre-wrap;
  }

  .aa-focus__rail {
    display: flex; justify-content: center; gap: 12px;
    padding: 0 32px 28px;
  }
  .aa-btn {
    font: inherit;
    font-size: 0.875rem; font-weight: 600;
    padding: 10px 20px;
    border-radius: var(--aa-radius-md);
    border: 1px solid transparent;
    cursor: pointer;
    transition: background 0.2s var(--aa-ease-out), transform 0.18s var(--aa-ease-spring);
    display: inline-flex; align-items: center; gap: 8px;
  }
  .aa-btn:active { transform: scale(0.97); }
  .aa-btn--ghost { background: transparent; color: var(--aa-text-3); }
  .aa-btn--ghost:hover { background: var(--aa-surface); color: var(--aa-text); }
  .aa-btn .kbd {
    font-family: var(--aa-font-mono);
    font-size: 11px;
    background: oklch(0.96 0.01 230);
    border: 1px solid var(--aa-border);
    padding: 1px 6px;
    border-radius: var(--aa-radius-sm);
    color: var(--aa-text-3);
  }

  .canvas-tag {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    background: var(--aa-surface);
    border: 1px solid var(--aa-border);
    padding: 6px 14px;
    border-radius: var(--aa-radius-full);
    font-size: 11px; font-weight: 600; letter-spacing: 0.06em;
    color: var(--aa-text-3);
    text-transform: uppercase;
    z-index: 200;
    box-shadow: var(--aa-shadow-sm);
  }
</style>
</head>
<body>

<div class="canvas-tag">D · Margin Clock</div>

<div class="aa-focus" role="dialog" aria-modal="true">
  <div class="aa-focus__top">
    <!-- LEFT: the clock lives in the margin, not the central column -->
    <div class="aa-clock">
      <div class="aa-clock__row">
        <span class="aa-clock__num" id="clockNum">18</span>
        <span class="aa-clock__unit">min in</span>
      </div>
      <div class="aa-clock__label">
        <span class="dot" aria-hidden="true"></span>
        in focus
      </div>
    </div>

    <!-- RIGHT: session footprint + close -->
    <div class="aa-focus__top-right">
      <div class="aa-session">
        started 9:23<span class="aa-session__sep">·</span>on Onboarding
      </div>
      <button class="aa-close" aria-label="Exit focus">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
          <path d="M4 4l8 8M12 4l-8 8"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="aa-focus__body">
    <div class="aa-presence">
      <div class="aa-presence__halo" aria-hidden="true"></div>
      <button class="aa-presence__circle" aria-label="Complete task">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12.5l4.5 4.5L19 7"/>
        </svg>
      </button>
    </div>

    <h1 class="aa-title">Write the onboarding copy for the first-run lens picker</h1>

    <div class="aa-meta">
      <span>due today</span>
      <span class="aa-meta__sep">·</span>
      <span>30 min</span>
    </div>

    <div class="aa-below">
      <div class="aa-notes">
        <div class="aa-notes__label">Working notes</div>
        <div class="aa-notes__body">Lead with the question, not the feature. "What do you want to make space for?" — then offer lens presets. Keep it under 60 words.</div>
      </div>
    </div>
  </div>

  <div class="aa-focus__rail">
    <button class="aa-btn aa-btn--ghost">Exit focus <span class="kbd">esc</span></button>
  </div>
</div>

<script>
  // Margin clock — informational elapsed time, peripheral position.
  (function () {
    const numEl = document.getElementById('clockNum');
    if (!numEl) return;
    const startedAt = Date.now() - 18 * 60 * 1000;
    function tick() {
      const mins = Math.floor((Date.now() - startedAt) / 60000);
      numEl.textContent = String(mins);
    }
    tick();
    setInterval(tick, 15000);
  })();
</script>
</body>
</html>
